name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app.py portfolio_app tests
      - name: Lint with Ruff
        run: python -m ruff check .
      - name: Type-check with mypy
        run: python -m mypy portfolio_app
      - name: Run tests with core coverage gate
        run: >-
          python -m pytest
          --cov=portfolio_app
          --cov-report=term-missing
          --cov-report=xml
          --junitxml=test-results.xml
          --cov-fail-under=70
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            coverage.xml
            test-results.xml
          if-no-files-found: ignore
